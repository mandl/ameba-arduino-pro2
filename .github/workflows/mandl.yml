name: Arduino Builder Mandl

on:
  push:
    tags: ["v*"]
    branches: ["*"]
  workflow_dispatch:

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: 1. Checkout Code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: 2. Build ZIP and Update JSON
        id: build
        run: |
          # Safe fallback tag if triggered by a branch push
          if [[ "${{ github.ref }}" == refs/tags/* ]]; then
            TAG="${GITHUB_REF#refs/tags/}"
          else
            TAG=$(git describe --tags --abbrev=0 --always 2>/dev/null || echo "v0.0.0-${{ github.sha }}")
          fi
          
          FILENAME="ameba_pro2_${TAG}.zip"
          JSON_PATH="${{ github.workspace }}/Arduino_package/package_realtek_amebapro2_index.json"
          RELEASE_DIR="${{ github.workspace }}/Arduino_package/release"
          
          mkdir -p "$RELEASE_DIR"
          
          # Create ZIP (cd into hardware so the ZIP root is correct for Arduino)
          cd "${{ github.workspace }}/Arduino_package"
          zip -r "$RELEASE_DIR/${FILENAME}" hardware/
          cd "${{ github.workspace }}"
          
          # Metadata
          SHA=$(sha256sum "$RELEASE_DIR/${FILENAME}" | awk '{print $1}')
          SIZE=$(stat -c%s "$RELEASE_DIR/${FILENAME}")
          URL="https://github.com/${{ github.repository }}/releases/download/${TAG}/${FILENAME}"
          echo "::notice title=Toolchain Hash::$SHA"
          echo "::notice title=Toolchain Size::$SIZE"
          
          # Define Dependencies
          TOOLS_DATA='[
            {"packager": "realtek", "name": "ameba_pro2_toolchain", "version": "1.0.1-p1"},
            {"packager": "realtek", "name": "ameba_pro2_toolchain2", "version": "1.0.1-p2"},
            {"packager": "realtek", "name": "ameba_pro2_tools", "version": "1.4.7"},
            {"packager": "realtek", "name": "ameba_pro2_nn_models", "version": "1.0.3"}
          ]'
          
          tmp=$(mktemp)
          
          # FIXED JQ SYNTAX TO PRESERVE ARDUINO JSON FORMAT
          jq --arg ver "$TAG" \
             --arg size "$SIZE" \
             --arg sha "$SHA" \
             --arg file "$FILENAME" \
             --arg url "$URL" \
             --argjson tools "$TOOLS_DATA" \
            '(.packages[] | select(.name == "realtek")).platforms |= (
              [ {
                "name": "Ameba Pro2 Boards",
                "architecture": "AmebaPro2",
                "version": $ver,
                "category": "Contributed",
                "url": $url,
                "archiveFileName": $file,
                "checksum": ("SHA-256:" + $sha),
                "size": ($size | tonumber),
                "boards": [
                  {"name": "AMB82 (RTL8735B)"},
                  {"name": "AMB82-MINI (RTL8735B)"}
                ],
                "toolsDependencies": $tools
              } ] 
              + 
              [ .[]? | select(.version != $ver) ]
            )' "$JSON_PATH" > "$tmp" && mv "$tmp" "$JSON_PATH"
          
          # Copy updated JSON to release folder for upload
          cp "$JSON_PATH" "$RELEASE_DIR/"
          
          # FIXED: Added missing $ sign to GITHUB_OUTPUT environment target paths
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "zip_path=$RELEASE_DIR/${FILENAME}" >> "$GITHUB_OUTPUT"
          echo "json_asset=$RELEASE_DIR/$(basename $JSON_PATH)" >> "$GITHUB_OUTPUT"

      - name: 3. Push Updated JSON to Repo
        if: false
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "chore: update index for ${{ steps.build.outputs.tag }}"
          file_pattern: 'Arduino_package/*.json'

      - name: 4. Create Release & Upload Assets
        # FIXED: Prevent branch triggers from accidentally breaking on production releases
        if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.build.outputs.tag }}
          target_commitish: ${{ github.sha }}
          files: |
            ${{ steps.build.outputs.zip_path }}
            ${{ steps.build.outputs.json_asset }}
          generate_release_notes: true
